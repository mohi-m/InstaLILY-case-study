services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-partselect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partselect}
      POSTGRES_DB: ${POSTGRES_DB:-partselect}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-partselect}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-partselect}:${POSTGRES_PASSWORD:-partselect}@db:5432/${POSTGRES_DB:-partselect}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.4-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # One-shot data pipeline. Does NOT start on `up` (profile-gated).
  # Run once:  docker compose run --rm scraper python run.py
  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-partselect}:${POSTGRES_PASSWORD:-partselect}@db:5432/${POSTGRES_DB:-partselect}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      SCRAPE_MAX_MODELS: ${SCRAPE_MAX_MODELS:-40}
      SCRAPE_MAX_PARTS: ${SCRAPE_MAX_PARTS:-200}
      SCRAPE_MIN_DELAY: ${SCRAPE_MIN_DELAY:-3}
      SCRAPE_MAX_DELAY: ${SCRAPE_MAX_DELAY:-7}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
